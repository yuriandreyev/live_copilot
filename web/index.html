<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Copilot</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>Live Copilot</h1>
      <div class="controls">
        <span id="status" role="status" data-state="idle">Idle</span>
        <time id="elapsed">00:00</time>
        <button id="start">Start capture</button>
        <button id="stop" disabled>Stop</button>
      </div>
    </header>
    <p id="error" role="alert" hidden></p>
    <div class="workspace">
      <section aria-labelledby="transcript-heading">
        <h2 id="transcript-heading">Transcript</h2>
        <p id="transcript-empty" class="muted">Start capture to see the transcript here.</p>
        <ol id="transcript" aria-live="polite"></ol>
        <p id="interim" class="muted" hidden></p>
        <p id="transcript-timing" class="timing" hidden></p>
      </section>
      <section aria-labelledby="recommendations-heading">
        <h2 id="recommendations-heading">Recommendations</h2>
        <p id="recommendations-empty" class="muted">Recommendations appear here when available.</p>
        <ul id="recommendations" aria-live="polite"></ul>
      </section>
    </div>
  </main>
</body>
</html>
