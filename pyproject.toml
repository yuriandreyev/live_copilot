[project]
name = "live-ai-copilot"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.17.2",
    "anyio==4.16.0",
    "asyncpg==0.31.0",
    "fastapi==0.121.3",
    "pydantic==2.12.4",
    "pydantic-settings==2.12.0",
    "sqlalchemy[asyncio]==2.0.44",
    "uvicorn==0.38.0",
    "websockets==15.0.1",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==1.19.1",
    "pytest==8.4.2",
    "ruff==0.14.5",
]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api", "src/worker", "src/knowledge", "src/copilot_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
